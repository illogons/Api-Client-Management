spring.application.name=client-management-api

# Local development database (H2)
spring.datasource.url=jdbc:h2:file:./data/client-management
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8081

springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.display-request-duration=true

spring.jpa.open-in-view=false

# Disable tracing/extra management integrations for the standalone project
management.tracing.sampling.probability=0.0
